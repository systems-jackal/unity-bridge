<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Bridge | Connected Digital Ecosystems</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800;900&family=Nunito:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header id="navbar">
        <div class="container">
            <nav>
                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#services">Services</a></li>
                    <li><a href="#why">Why Us</a></li>
                    <li><a href="#team">Team</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
                <a href="#contact" class="btn btn-primary">Work with us</a>
            </nav>
        </div>
    </header>

    <main id="main-content"></main>

    <script>
        // Load sections in order
        const sections = [
            'sections/about.html',
            'sections/services.html',
            'sections/why-us.html',
            'sections/team.html',
            'sections/contact.html',
            'sections/newsletter.html',
            'sections/footer.html'
        ];

        async function loadSections() {
            const main = document.getElementById('main-content');
            for (const sec of sections) {
                try {
                    const res = await fetch(sec);
                    if (res.ok) {
                        const html = await res.text();
                        main.insertAdjacentHTML('beforeend', html);
                    } else {
                        console.warn(`Failed to load ${sec}`);
                    }
                } catch (err) {
                    console.error(err);
                }
            }
            // After all sections are loaded, re-attach any dynamic behaviour (e.g., form submission)
            attachFormHandler();
        }

        function attachFormHandler() {
            const form = document.getElementById('contact-form');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    alert('Form submission demo – connect to your backend later.');
                });
            }
        }

        loadSections();
    </script>
</body>

</html>
